<!doctype html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Drainage Mine</title>
    <script type="module" src="script.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Monitoring des Niveaux</h1>

<div class="container">
    <div class="level">
        <p>Niveau d'eau</p>
        <div class="bar-container">
            <div class="bar" id="water-bar"></div>
        </div>
        <p id="water-value">0%</p>
        <p class="threshold">Seuil : <span id="water-threshold">50%</span></p>
    </div>

    <div class="level">
        <p>CH4</p>
        <div class="bar-container">
            <div class="bar" id="ch4-bar"></div>
        </div>
        <p id="ch4-value">0%</p>
        <p class="threshold">Seuil : <span id="ch4-threshold">50%</span></p>
    </div>

    <div class="level">
        <p>CO2</p>
        <div class="bar-container">
            <div class="bar" id="co2-bar"></div>
        </div>
        <p id="co2-value">0%</p>
        <p class="threshold">Seuil : <span id="co2-threshold">50%</span></p>
    </div>

    <div class="status">
        <p>Ventilateur : <span id="fan-status">OFF</span></p>
    </div>

    <div class="status">
        <p>Pompe : <span id="pump-status">OFF</span></p>
    </div>
</div>

<!-- Formulaire pour modifier les constantes -->
<div class="config">
    <h2>Configuration des augmentations</h2>
    <div class="param">
        <label for="aug_CH4">Augmentation CH4 :</label>
        <input type="number" id="aug_CH4" step="0.1" value="4">
    </div>

    <div class="param">
        <label for="aug_CO">Augmentation CO :</label>
        <input type="number" id="aug_CO" step="0.1" value="3">    
    </div>

    <div class="param">
        <label for="aug_H2O">Augmentation H2O :</label>
        <input type="number" id="aug_H2O" step="0.1" value="4.5">    
    </div>

    <button id="applyConfig">Appliquer</button>
</div>

<script>
    document.getElementById("applyConfig").addEventListener("click", function() {
        const newAugCH4 = parseFloat(document.getElementById("aug_CH4").value);
        const newAugCO = parseFloat(document.getElementById("aug_CO").value);
        const newAugH2O = parseFloat(document.getElementById("aug_H2O").value);

        window.aug_CH4 = newAugCH4;
        window.aug_CO = newAugCO;
        window.aug_H2O = newAugH2O;

        console.log("Nouvelle configuration appliquée :", { newAugCH4, newAugCO, newAugH2O });
    });
</script>

</body>
</html>
